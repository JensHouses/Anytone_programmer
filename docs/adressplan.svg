<svg xmlns="http://www.w3.org/2000/svg" width="900" height="974" viewBox="0 0 900 974" font-family="-apple-system,Segoe UI,Roboto,sans-serif"><rect width="900" height="974" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="600" fill="#15181d">Adressplan AnyTone AT-D878UV II Plus &#183; Revision 10</text><text x="24" y="54" font-size="12" fill="#666e7a">geprueft an AT-D878UV II Plus, Firmware 4.00 (Kennung V101)</text><text x="24" y="70" font-size="13" font-weight="600" fill="#15181d">Der Adressraum (flaechentreu)</text><rect x="24.0" y="84" width="109.7" height="26" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="101" font-size="12" fill="#15181d"></text><text x="125.7" y="101" font-size="11" fill="#666e7a" text-anchor="end"></text><rect x="135.7" y="84" width="26.0" height="26" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="143.7" y="101" font-size="12" fill="#15181d"></text><text x="153.7" y="101" font-size="11" fill="#666e7a" text-anchor="end"></text><rect x="163.7" y="84" width="82.3" height="26" rx="3" fill="#f4e7c9" stroke="#8a5a00"/><text x="171.7" y="101" font-size="12" fill="#15181d"></text><text x="238.0" y="101" font-size="11" fill="#666e7a" text-anchor="end"></text><rect x="248.0" y="84" width="65.1" height="26" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="256.0" y="101" font-size="12" fill="#15181d"></text><text x="305.1" y="101" font-size="11" fill="#666e7a" text-anchor="end"></text><rect x="315.1" y="84" width="26.0" height="26" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="323.1" y="101" font-size="12" fill="#15181d"></text><text x="333.1" y="101" font-size="11" fill="#666e7a" text-anchor="end"></text><rect x="343.1" y="84" width="581.1" height="26" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="351.1" y="101" font-size="12" fill="#15181d"></text><text x="916.2" y="101" font-size="11" fill="#666e7a" text-anchor="end"></text><text x="34" y="118" font-size="11" fill="#15181d">Kanaele &#8212; 0x00800000, 8.0 MB</text><text x="34" y="133" font-size="11" fill="#15181d">Zonen- und Scanlisten &#8212; 0x01000000, 1.0 MB</text><text x="34" y="148" font-size="11" fill="#15181d">Codeplug: Bitmaps, Namen, Kontakte, APRS &#8212; 0x02400000, 6.0 MB</text><text x="34" y="163" font-size="11" fill="#15181d">Rufzeichendatenbank: Index &#8212; 0x04000000, 4.8 MB</text><text x="34" y="178" font-size="11" fill="#15181d">Rufzeichendatenbank: Kopf &#8212; 0x04840000, 0.0 MB</text><text x="34" y="193" font-size="11" fill="#15181d">Rufzeichendatenbank: Datensaetze &#8212; 0x05500000, 42.4 MB</text><text x="24" y="224" font-size="13" font-weight="600" fill="#15181d">Datensaetze, die atprog decodiert</text><rect x="24.0" y="234" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="251" font-size="12" fill="#15181d">0x00800000  channel (4000 &#215; 64 B)</text><text x="868.0" y="251" font-size="11" fill="#666e7a" text-anchor="end">rx_freq, tx_offset, ch_type, power, bandwidth</text><rect x="24.0" y="260" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="277" font-size="12" fill="#15181d">0x01000000  zone_list (250 &#215; 512 B)</text><text x="868.0" y="277" font-size="11" fill="#666e7a" text-anchor="end">members</text><rect x="24.0" y="286" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="303" font-size="12" fill="#15181d">0x01080000  scan_list (250 &#215; 512 B)</text><text x="868.0" y="303" font-size="11" fill="#666e7a" text-anchor="end">priority_ch1, priority_ch2, look_back_a, look_back_b, dropout_delay</text><rect x="24.0" y="312" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="329" font-size="12" fill="#15181d">0x02501000  aprs (1 &#215; 256 B)</text><text x="868.0" y="329" font-size="11" fill="#666e7a" text-anchor="end">fm_frequency, tx_delay, manual_interval, auto_interval, destination</text><rect x="24.0" y="338" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="355" font-size="12" fill="#15181d">0x02501200  aprs_message (1 &#215; 64 B)</text><text x="868.0" y="355" font-size="11" fill="#666e7a" text-anchor="end">text</text><rect x="24.0" y="364" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="381" font-size="12" fill="#15181d">0x02540000  zone_name (250 &#215; 32 B)</text><text x="868.0" y="381" font-size="11" fill="#666e7a" text-anchor="end">name</text><rect x="24.0" y="390" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="407" font-size="12" fill="#15181d">0x02580000  radio_id (250 &#215; 32 B)</text><text x="868.0" y="407" font-size="11" fill="#666e7a" text-anchor="end">radio_id, name</text><rect x="24.0" y="416" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="433" font-size="12" fill="#15181d">0x02680000  contact (10000 &#215; 100 B)</text><text x="868.0" y="433" font-size="11" fill="#666e7a" text-anchor="end">call_type, name, tg_id, call_alert</text><rect x="24.0" y="442" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="459" font-size="12" fill="#15181d">0x02980000  rx_group (250 &#215; 512 B)</text><text x="868.0" y="459" font-size="11" fill="#666e7a" text-anchor="end">members, name</text><text x="24" y="484" font-size="13" font-weight="600" fill="#15181d">Bereiche ohne eigene Datensaetze</text><rect x="24.0" y="494" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="511" font-size="12" fill="#15181d">0x024C1300  zone_bitmap</text><text x="868.0" y="511" font-size="11" fill="#666e7a" text-anchor="end">welche Zonen belegt sind</text><rect x="24.0" y="520" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="537" font-size="12" fill="#15181d">0x024C1320  radioid_bitmap</text><text x="868.0" y="537" font-size="11" fill="#666e7a" text-anchor="end">welche Radio-IDs belegt sind</text><rect x="24.0" y="546" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="563" font-size="12" fill="#15181d">0x024C1340  scanlist_bitmap</text><text x="868.0" y="563" font-size="11" fill="#666e7a" text-anchor="end">welche Scanlisten belegt sind</text><rect x="24.0" y="572" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="589" font-size="12" fill="#15181d">0x024C1360  zone_hide</text><text x="868.0" y="589" font-size="11" fill="#666e7a" text-anchor="end">Sichtbarkeit der Zonen</text><rect x="24.0" y="598" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="615" font-size="12" fill="#15181d">0x024C1500  channel_bitmap</text><text x="868.0" y="615" font-size="11" fill="#666e7a" text-anchor="end">welche Kanaele belegt sind</text><rect x="24.0" y="624" width="852.0" height="24" rx="3" fill="#f4e7c9" stroke="#9a6b00"/><text x="32.0" y="641" font-size="12" fill="#15181d">0x02500000  settings</text><text x="868.0" y="641" font-size="11" fill="#666e7a" text-anchor="end">Grundeinstellungen; nur APRS daraus ausgewertet</text><rect x="24.0" y="650" width="852.0" height="24" rx="3" fill="#f4e7c9" stroke="#9a6b00"/><text x="32.0" y="667" font-size="12" fill="#15181d">0x025C0000  status_messages</text><text x="868.0" y="667" font-size="11" fill="#666e7a" text-anchor="end">Statusmeldungen, Aufbau nicht untersucht</text><rect x="24.0" y="676" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="693" font-size="12" fill="#15181d">0x02600000  contact_index</text><text x="868.0" y="693" font-size="11" fill="#666e7a" text-anchor="end">Kontakte nach ID sortiert; ohne sie zeigt das Geraet nur einen</text><rect x="24.0" y="702" width="852.0" height="24" rx="3" fill="#d7ece0" stroke="#2f7d4f"/><text x="32.0" y="719" font-size="12" fill="#15181d">0x02640000  contact_bitmap</text><text x="868.0" y="719" font-size="11" fill="#666e7a" text-anchor="end">welche Kontakte belegt sind, invertiert</text><rect x="24.0" y="728" width="852.0" height="24" rx="3" fill="#f4e7c9" stroke="#9a6b00"/><text x="32.0" y="745" font-size="12" fill="#15181d">0x02940000  dtmf_contacts</text><text x="868.0" y="745" font-size="11" fill="#666e7a" text-anchor="end">DTMF-Schnellwahl; Satzaufbau bekannt, Abstand unbestimmt</text><text x="24" y="770" font-size="13" font-weight="600" fill="#15181d">Noch nicht zugeordnet</text><rect x="24.0" y="780" width="852.0" height="24" rx="3" fill="#e6e8ec" stroke="#8a8f98"/><text x="32.0" y="797" font-size="12" fill="#15181d">0x02440000  256 KB</text><text x="868.0" y="797" font-size="11" fill="#666e7a" text-anchor="end">leer, ohne Gueltigkeitsmarke; nimmt keine Schreibzugriffe an - vermutlich nich</text><rect x="24.0" y="806" width="852.0" height="24" rx="3" fill="#e6e8ec" stroke="#8a8f98"/><text x="32.0" y="823" font-size="12" fill="#15181d">0x02480000  256 KB</text><text x="868.0" y="823" font-size="11" fill="#666e7a" text-anchor="end">belegt, BCD-artige Werte; Inhalt unbekannt</text><rect x="24.0" y="832" width="852.0" height="24" rx="3" fill="#e6e8ec" stroke="#8a8f98"/><text x="32.0" y="849" font-size="12" fill="#15181d">0x024C0000  4 KB</text><text x="868.0" y="849" font-size="11" fill="#666e7a" text-anchor="end">belegt; enthaelt zufaellig aussehende Daten, moeglicherweise Schluesselmateria</text><rect x="24.0" y="858" width="852.0" height="24" rx="3" fill="#e6e8ec" stroke="#8a8f98"/><text x="32.0" y="875" font-size="12" fill="#15181d">0x024E0000  256 KB</text><text x="868.0" y="875" font-size="11" fill="#666e7a" text-anchor="end">Zweitkopie des Blocks 0x024C0000 (Kopienverwaltung des Geraets)</text><rect x="24.0" y="884" width="852.0" height="24" rx="3" fill="#e6e8ec" stroke="#8a8f98"/><text x="32.0" y="901" font-size="12" fill="#15181d">0x047E0000  384 KB</text><text x="868.0" y="901" font-size="11" fill="#666e7a" text-anchor="end">kleine Zaehlerwerte; Inhalt unbekannt</text><rect x="24" y="934" width="14" height="14" rx="2" fill="#d7ece0" stroke="#2f7d4f"/><text x="44" y="946" font-size="11" fill="#666e7a">ausgewertet und bearbeitbar</text><rect x="264" y="934" width="14" height="14" rx="2" fill="#f4e7c9" stroke="#9a6b00"/><text x="284" y="946" font-size="11" fill="#666e7a">gesichert, Inhalt nicht gedeutet</text><rect x="504" y="934" width="14" height="14" rx="2" fill="#e6e8ec" stroke="#8a8f98"/><text x="524" y="946" font-size="11" fill="#666e7a">noch nicht zugeordnet</text></svg>